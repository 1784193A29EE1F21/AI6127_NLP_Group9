[project]
name = "rag"
version = "0.2.0"
description = "AI6127 group assignment - hybrid RAG question answering over Wikipedia"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "sentence-transformers>=6.0.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "snowballstemmer>=2.2",
    "google-genai>=2.19.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.3",
    "gradio>=5.0",
    "tqdm>=4.66",
    "openpyxl>=3.1",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
hf = ["datasets>=3.0"]          # only for --source hf in 01_build_corpus.py
bertscore = ["bert-score>=0.3.13"]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
